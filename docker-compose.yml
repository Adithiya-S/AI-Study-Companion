version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: aura_study_postgres
    environment:
      POSTGRES_USER: drift
      POSTGRES_PASSWORD: driftpassword
      POSTGRES_DB: study_companion
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
